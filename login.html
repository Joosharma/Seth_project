<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login </title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch -->
</head>

<body>
   
    <main>
        <!-- login -->
        <section class="section-padding min-h-screen bg-soft flex items-center justify-center px-4">

            <div class="grid lg:grid-cols-2 max-w-6xl w-full bg-white rounded-3xl overflow-hidden shadow-2xl">

                <!-- Left Side -->
                <div class="hidden lg:flex relative bg-gradient-teal-slate text-white p-12 items-center">

                    <div class="z-10">

                        <div class="inline-flex items-center gap-2 glass-dark rounded-full px-4 py-2 mb-6">

                            <ion-icon name="school-outline"></ion-icon>

                            <span class="text-sm font-semibold">
                                Admin Portal
                            </span>

                        </div>

                        <h1 class="font-display text-5xl font-bold leading-tight">

                            Seth Chhoteylal Academy

                        </h1>

                        <p class="mt-5 text-white/80 text-lg">

                            Secure access for administrators to manage admissions,
                            notices, gallery, events and website content.

                        </p>

                    </div>

                </div>

                <!-- Right Side -->
                <div class="p-8 md:p-12">

                    <div class="max-w-md mx-auto">

                        <div class="text-center mb-8">

                            <img src="assets/SCA NEW PNG2.png" alt="School Logo" class="w-20 h-20 mx-auto mb-4">

                            <h2 class="font-display text-3xl font-bold text-navy">

                                Welcome Back

                            </h2>

                            <p class="text-slate-text mt-2">

                                Sign in to your admin account

                            </p>

                        </div>

                        <form class="space-y-5">

                            <!-- Email -->
                            <div>

                                <label class="block text-sm font-semibold text-navy mb-2">

                                    Email Address

                                </label>

                                <input type="email" placeholder="admin@example.com" class="input-field">

                            </div>

                            <!-- Password -->
                            <div>

                                <label class="block text-sm font-semibold text-navy mb-2">

                                    Password

                                </label>

                                <input type="password" placeholder="••••••••" class="input-field">

                            </div>

                            <!-- Remember -->
                            <div class="flex items-center justify-between">

                                <label class="flex items-center gap-2 text-sm text-slate-text">

                                    <input type="checkbox">

                                    Remember me

                                </label>

                                <a href="#" class="text-sm text-teal hover:underline">

                                    Forgot Password?

                                </a>

                            </div>

                            <!-- Button -->
                            <button type="submit"
                                class="w-full bg-teal hover:bg-teal-dark text-white font-semibold py-3 rounded-xl transition-all duration-300">

                                Login

                            </button>

                        </form>

                        <!-- Footer -->
                        <p class="text-center text-sm text-slate-text mt-8">

                            © 2026 Seth Chhoteylal Academy. All rights reserved.

                        </p>

                    </div>

                </div>

            </div>

        </section>
    </main>
   
</body>

</html>
